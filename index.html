<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROVIT26 - Sistem Informasi Progres</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5); z-index: 9999;
      display: flex; justify-content: center; align-items: center; color: #fff;
    }
  </style>
</head>
<body class="bg-light">

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay d-none">
    <div class="spinner-border text-light" role="status">
      <span class="visually-hidden">Memuat...</span>
    </div>
  </div>

  <!-- SECTION LOGIN -->
  <div id="loginSection" class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title text-center mb-4">Login PROVIT26</h3>
            <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>
            <form id="loginForm" onsubmit="processLogin(event)">
              <div class="mb-3">
                <label for="username" class="form-label">NPSN / Username</label>
                <input type="text" class="form-control" id="username" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Masuk</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SECTION DASHBOARD -->
  <div id="dashboardSection" class="container py-4 d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="h4 m-0" id="userDisplayName">Dinas Pendidikan</h2>
        <span class="badge bg-primary" id="userRoleBadge">USER</span>
      </div>
      <button class="btn btn-outline-danger btn-sm" onclick="logout()">Keluar</button>
    </div>

    <!-- Form Input Progres -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white fw-bold">Form Progres Pekerjaan</div>
      <div class="card-body">
        <form id="progresForm" onsubmit="submitProgres(event)">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Nama SD</label>
              <input type="text" id="namaSd" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Kecamatan</label>
              <input type="text" id="kecamatan" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Nama Tim</label>
              <input type="text" id="namaTim" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Pilih Menu Pekerjaan</label>
              <select id="namaMenu" class="form-select" required></select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Nilai Pekerjaan (Rp)</label>
              <input type="number" id="nilai" class="form-control" min="0" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Volume Ruang</label>
              <input type="number" id="volumeRuang" class="form-control" min="0" required>
            </div>
            <div class="col-12 text-end">
              <button type="submit" class="btn btn-success">Simpan Data Progres</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabel Database -->
    <div class="card shadow-sm">
      <div class="card-header bg-white fw-bold">Tabel Progres Real-Time</div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-striped mb-0">
            <thead class="table-dark">
              <tr>
                <th>ID Input</th>
                <th>NPSN</th>
                <th>Nama SD</th>
                <th>Kecamatan</th>
                <th>Menu Pekerjaan</th>
                <th>Nilai (Rp)</th>
                <th>Volume</th>
                <th>Nama Tim</th>
              </tr>
            </thead>
            <tbody id="progresTableBody">
              <tr>
                <td colspan="8" class="text-center text-muted">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // PENTING: Ganti nilai di bawah ini dengan URL Web App Google Apps Script Anda (berakhiran /exec)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx.../exec"; 
    let currentUser = null;

    document.addEventListener("DOMContentLoaded", function() {
      const savedUser = localStorage.getItem("provit_user");
      if (savedUser) {
        try {
          currentUser = JSON.parse(savedUser);
          showDashboard(currentUser);
        } catch(e) {
          localStorage.removeItem("provit_user");
        }
      }
    });

    function toggleLoading(show) {
      const overlay = document.getElementById("loadingOverlay");
      if (overlay) overlay.classList.toggle("d-none", !show);
    }

    function showAlert(msg) {
      const alertBox = document.getElementById("loginAlert");
      if (alertBox) {
        alertBox.textContent = msg;
        alertBox.classList.remove("d-none");
      }
    }

    // PROSES LOGIN BEBAS CORS (GET request)
    async function processLogin(e) {
      e.preventDefault();
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value.trim();
      
      const alertBox = document.getElementById("loginAlert");
      if (alertBox) alertBox.classList.add("d-none");

      toggleLoading(true);
      try {
        const url = `${SCRIPT_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`;
        
        const res = await fetch(url);
        const result = await res.json();

        if (result.status === "success" && result.user) {
          currentUser = result.user;
          currentUser.username = u; 
          localStorage.setItem("provit_user", JSON.stringify(currentUser));
          showDashboard(currentUser);
        } else {
          showAlert(result.message || "NPSN atau password Anda salah.");
        }
      } catch (err) {
        console.error(err);
        showAlert("Login gagal: Terjadi kesalahan koneksi. Pastikan URL SCRIPT_URL sudah benar.");
      } finally {
        toggleLoading(false);
      }
    }

    async function showDashboard(user) {
      document.getElementById("loginSection").classList.add("d-none");
      document.getElementById("dashboardSection").classList.remove("d-none");
      
      document.getElementById("userDisplayName").textContent = user.sekolah || "Dinas Pendidikan";
      document.getElementById("userRoleBadge").textContent = user.role || "USER";

      if (user.role === "SEKOLAH") {
        document.getElementById("namaSd").value = user.sekolah || "";
        document.getElementById("kecamatan").value = user.kecamatan || "Kab. Rembang";
        document.getElementById("namaTim").value = user.namaTim || "HARYANTO";
        document.getElementById("namaSd").setAttribute("readonly", true);
        document.getElementById("kecamatan").setAttribute("readonly", true);
      } else {
        document.getElementById("namaSd").removeAttribute("readonly");
        document.getElementById("kecamatan").removeAttribute("readonly");
        document.getElementById("namaSd").style.backgroundColor = "#ffffff";
        document.getElementById("kecamatan").style.backgroundColor = "#ffffff";
        document.getElementById("namaTim").value = "TIM DINAS";
      }

      loadMasterMenu();
      loadProgresTable();
    }

    function loadMasterMenu() {
      const menuData = [
        { id: "M01", nama: "Pembangunan ruang kelas baru" }, { id: "M02", nama: "Pembangunan perpustakaan" },
        { id: "M03", nama: "Pembangunan kamar mandi" }, { id: "M04", nama: "Pembangunan ruang administrasi" },
        { id: "M05", nama: "Pembangunan ruang UKS" }, { id: "M06", nama: "Pembangunan ruang laboratorium" },
        { id: "M07", nama: "Pembangunan rumah dinas" }, { id: "M08", nama: "Rehab ruang kelas" },
        { id: "M09", nama: "Rehab perpustakaan" }, { id: "M10", nama: "Rehab kamar mandi" },
        { id: "M11", nama: "Rehab ruang administrasi" }, { id: "M12", nama: "Rehab ruang laboratorium" },
        { id: "M13", nama: "Rehab rumah dinas" }, { id: "M14", nama: "Penataan lingkungan sekolah" },
        { id: "M15", nama: "Perabot (meubelair)" }, { id: "M16", nama: "Perencanaan" },
        { id: "M17", nama: "Pengawasan" }, { id: "M18", nama: "Pengelolaan" }
      ];

      const selectMenu = document.getElementById("namaMenu");
      if (!selectMenu) return;

      selectMenu.innerHTML = '<option value="">-- Pilih Menu Pekerjaan --</option>';
      menuData.forEach(item => {
        const option = document.createElement("option");
        option.value = item.nama;
        option.textContent = `${item.id} - ${item.nama}`;
        selectMenu.appendChild(option);
      });
    }

    async function loadProgresTable() {
      const tableBody = document.getElementById("progresTableBody");
      if (!tableBody) return;

      try {
        const res = await fetch(`${SCRIPT_URL}?action=readData`);
        const result = await res.json();

        if (result.status === "success" && result.data) {
          tableBody.innerHTML = "";
          const filteredData = currentUser.role === "SEKOLAH" 
            ? result.data.filter(item => String(item.npsn) === String(currentUser.username))
            : result.data;

          if (filteredData.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">Belum ada data progres untuk akun ini.</td></tr>';
            return;
          }

          filteredData.forEach(row => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td><span class="badge bg-secondary">${row.idInput || '-'}</span></td>
              <td>${row.npsn || '-'}</td>
              <td><strong>${row.namaSd || '-'}</strong></td>
              <td>${row.kecamatan || '-'}</td>
              <td>${row.namaMenu || '-'}</td>
              <td class="text-end fw-bold text-success">Rp ${Number(row.nilai || 0).toLocaleString('id-ID')}</td>
              <td class="text-center">${row.volumeRuang || 0}</td>
              <td><small class="text-muted">${row.namaTim || '-'}</small></td>
            `;
            tableBody.appendChild(tr);
          });
        } else {
          tableBody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">Belum ada data progres.</td></tr>';
        }
      } catch (err) {
        console.error(err);
        tableBody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">Gagal memuat tabel database real-time.</td></tr>';
      }
    }

    // PROSES SUBMIT BEBAS CORS (GET request)
    async function submitProgres(e) {
      e.preventDefault();
      
      const npsn = currentUser.username;
      const namaSd = document.getElementById("namaSd").value;
      const kecamatan = document.getElementById("kecamatan").value;
      const namaMenu = document.getElementById("namaMenu").value;
      const nilai = document.getElementById("nilai").value;
      const volumeRuang = document.getElementById("volumeRuang").value;
      const namaTim = document.getElementById("namaTim").value;

      toggleLoading(true);
      try {
        const queryParams = new URLSearchParams({
          action: "insertProgres",
          npsn: npsn,
          namaSd: namaSd,
          kecamatan: kecamatan,
          namaMenu: namaMenu,
          nilai: nilai,
          volumeRuang: volumeRuang,
          namaTim: namaTim
        });

        const res = await fetch(`${SCRIPT_URL}?${queryParams.toString()}`);
        const result = await res.json();

        if (result.status === "success") {
          alert("✓ Data sukses disimpan ke Google Sheets!");
          document.getElementById("nilai").value = "";
          document.getElementById("volumeRuang").value = "";
          document.getElementById("namaMenu").value = "";
          await loadProgresTable();
        } else {
          alert("Gagal: " + result.message);
        }
      } catch (err) {
        console.error(err);
        alert("Error jaringan saat menyimpan progres.");
      } finally {
        toggleLoading(false);
      }
    }

    function logout() {
      if (confirm("Keluar dari aplikasi PROVIT26?")) {
        localStorage.removeItem("provit_user");
        currentUser = null;
        document.getElementById("dashboardSection").classList.add("d-none");
        document.getElementById("loginSection").classList.remove("d-none");
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
      }
    }
  </script>
</body>
</html>
