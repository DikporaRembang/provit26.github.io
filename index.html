<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Data SD - Sistem PKS</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .btn-ultra {
      background: linear-gradient(135deg, #0d6efd, #0d47a1);
      color: #fff;
      border: none;
      font-weight: 600;
    }
    .btn-ultra:hover {
      background: linear-gradient(135deg, #0b5ed7, #0a3880);
      color: #fff;
    }
    .password-wrapper {
      position: relative;
    }
    .password-toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #6c757d;
      cursor: pointer;
    }
    /* Loading Spinner Overlay */
    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="d-none">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div class="container py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold text-dark mb-0"><i class="fa-solid fa-school text-primary me-2"></i>Master Data SD</h3>
        <p class="text-muted small mb-0">Kelola data sekolah, PKS, dan anggaran pagu</p>
      </div>
      <button class="btn btn-ultra rounded-3 px-3 py-2" onclick="openModalSd('add')">
        <i class="fa-solid fa-plus me-1"></i> Tambah SD Baru
      </button>
    </div>

    <!-- Tabel Master SD -->
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>NPSN</th>
              <th>Nama SD</th>
              <th>Kecamatan</th>
              <th>Masa PKS</th>
              <th>Mulai</th>
              <th>Selesai</th>
              <th class="text-end">Pagu (Rp)</th>
              <th>Role</th>
              <th class="text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="masterSdTableBody">
            <!-- Data akan dimuat otomatis oleh JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL FORM MASTER SD -->
  <div class="modal fade" id="modalSd" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 rounded-4 shadow-lg">
        <div class="modal-header border-0 pb-0">
          <h5 class="fw-bold modal-title" id="modalSdTitle">Form Data SD</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formSd">
            <input type="hidden" id="sdSubAction">

            <div class="mb-2">
              <label class="form-label fw-semibold small">NPSN</label>
              <input type="text" id="sdNpsn" class="form-control" placeholder="Contoh: 20300001" required>
            </div>

            <div class="mb-2">
              <label class="form-label fw-semibold small">Password</label>
              <div class="password-wrapper">
                <input type="password" id="sdPass" class="form-control pe-5" placeholder="Password akun" required>
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('sdPass', 'sdPassEyeIcon')">
                  <i class="fa-solid fa-eye" id="sdPassEyeIcon"></i>
                </button>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label fw-semibold small">Nama SD</label>
              <input type="text" id="sdNama" class="form-control" placeholder="Nama Sekolah" required>
            </div>

            <div class="mb-2">
              <label class="form-label fw-semibold small">Kecamatan</label>
              <input type="text" id="sdKecamatan" class="form-control" placeholder="Nama Kecamatan" required>
            </div>

            <div class="mb-2">
              <label class="form-label fw-semibold small">Masa PKS</label>
              <div class="input-group">
                <input type="number" id="sdMasaPks" class="form-control" placeholder="Contoh: 120" min="1" oninput="calculateTanggalSelesai()" required>
                <span class="input-group-text bg-light text-muted fw-semibold">Hari</span>
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label fw-semibold small">Mulai</label>
                <input type="date" id="sdMulai" class="form-control" onchange="calculateTanggalSelesai()" required>
              </div>
              <div class="col-6">
                <label class="form-label fw-semibold small">Selesai (Otomatis)</label>
                <input type="date" id="sdSelesai" class="form-control bg-light" readonly required>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label fw-semibold small">Pagu Anggaran (Rp)</label>
              <input type="number" id="sdPagu" class="form-control" placeholder="Contoh: 50000000" min="0" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold small">Role</label>
              <select id="sdRole" class="form-select">
                <option value="SEKOLAH">SEKOLAH</option>
                <option value="DINAS">DINAS</option>
              </select>
            </div>

            <button type="submit" class="btn btn-ultra w-100 rounded-3 py-2">Simpan Data SD</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toastMessage"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ==========================================
    // KONFIGURASI URL GOOGLE APPS SCRIPT
    // Ganti dengan Executable URL Web App Anda
    // ==========================================
    const SCRIPT_URL = "GANTI_DENGAN_URL_WEB_APP_GOOGLE_APPS_SCRIPT_ANDA";

    let modalSdObj;
    let toastObj;

    document.addEventListener("DOMContentLoaded", function () {
      modalSdObj = new bootstrap.Modal(document.getElementById('modalSd'));
      toastObj = new bootstrap.Toast(document.getElementById('liveToast'));
      loadMasterSd();
    });

    // Helper: Loading Overlay Toggle
    function toggleLoading(show) {
      const overlay = document.getElementById("loadingOverlay");
      if (show) overlay.classList.remove("d-none");
      else overlay.classList.add("d-none");
    }

    // Helper: Show Toast Notification
    function showToast(message, isSuccess = true) {
      const toastEl = document.getElementById("liveToast");
      const toastMsg = document.getElementById("toastMessage");
      toastEl.className = `toast align-items-center text-white border-0 ${isSuccess ? 'bg-success' : 'bg-danger'}`;
      toastMsg.textContent = message;
      toastObj.show();
    }

    // Toggle Visibility Password Field
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    // Hitung Otomatis Tanggal Selesai = Mulai + Masa PKS (Hari)
    function calculateTanggalSelesai() {
      const tglMulaiVal = document.getElementById("sdMulai").value;
      const masaPksVal = parseInt(document.getElementById("sdMasaPks").value, 10);

      if (tglMulaiVal && !isNaN(masaPksVal) && masaPksVal > 0) {
        const tglMulai = new Date(tglMulaiVal);
        tglMulai.setDate(tglMulai.getDate() + masaPksVal);

        const y = tglMulai.getFullYear();
        const m = String(tglMulai.getMonth() + 1).padStart(2, '0');
        const d = String(tglMulai.getDate()).padStart(2, '0');

        document.getElementById("sdSelesai").value = `${y}-${m}-${d}`;
      } else {
        document.getElementById("sdSelesai").value = "";
      }
    }

    // BACA DATA MASTER SD
    async function loadMasterSd() {
      toggleLoading(true);
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getMasterSd&_t=${Date.now()}`);
        const result = await res.json();
        const tbody = document.getElementById("masterSdTableBody");
        tbody.innerHTML = "";

        if (result.status === "success" && Array.isArray(result.data)) {
          if (result.data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" class="text-center py-4 text-muted">Tidak ada data SD.</td></tr>`;
          } else {
            result.data.forEach(sd => {
              const npsn = sd.npsn || '-';
              const pass = sd.password || '';
              const sekolah = sd.sekolah || '-';
              const kecamatan = sd.kecamatan || '-';
              const masaPks = sd.masaPks || '-';
              const mulai = sd.mulai || '-';
              const selesai = sd.selesai || '-';
              const pagu = Number(sd.pagu || 0);
              const role = sd.role || 'SEKOLAH';

              const cleanSekolah = sekolah.replace(/'/g, "\\'");
              const cleanKecamatan = kecamatan.replace(/'/g, "\\'");

              tbody.innerHTML += `<tr>
                <td><span class="badge bg-light text-dark font-monospace">${npsn}</span></td>
                <td><strong>${sekolah}</strong></td>
                <td>${kecamatan}</td>
                <td>${masaPks}</td>
                <td>${mulai}</td>
                <td>${selesai}</td>
                <td class="text-end fw-bold text-success font-monospace">Rp ${pagu.toLocaleString('id-ID')}</td>
                <td><span class="badge ${role === 'DINAS' ? 'bg-danger-subtle text-danger' : 'bg-primary-subtle text-primary'} fw-bold">${role}</span></td>
                <td class="text-center">
                  <button class="btn btn-sm btn-light me-1" title="Edit" onclick="openModalSd('edit', '${npsn}', '${pass}', '${cleanSekolah}', '${cleanKecamatan}', '${masaPks}', '${mulai}', '${selesai}', '${pagu}', '${role}')">
                    <i class="fa-solid fa-pen text-warning"></i>
                  </button>
                  <button class="btn btn-sm btn-light" title="Hapus" onclick="deleteSd('${npsn}')">
                    <i class="fa-solid fa-trash text-danger"></i>
                  </button>
                </td>
              </tr>`;
            });
          }
        } else {
          showToast(result.message || "Gagal memuat data Master SD", false);
        }
      } catch(e) { 
        showToast("Gagal memuat SD, periksa URL Script atau koneksi internet.", false); 
      } finally { 
        toggleLoading(false); 
      }
    }

    // BUKA MODAL DIALOG (TAMBAH / EDIT)
    function openModalSd(subAction, npsn="", pass="", sekolah="", kec="", masaPks="", mulai="", selesai="", pagu="0", role="SEKOLAH") {
      document.getElementById("sdSubAction").value = subAction;
      document.getElementById("sdNpsn").value = npsn;
      document.getElementById("sdNpsn").readOnly = (subAction === 'edit');
      document.getElementById("sdPass").value = pass;
      document.getElementById("sdNama").value = sekolah;
      document.getElementById("sdKecamatan").value = kec;
      
      const numMasaPks = masaPks ? parseInt(masaPks, 10) : "";
      document.getElementById("sdMasaPks").value = isNaN(numMasaPks) ? "" : numMasaPks;
      
      document.getElementById("sdMulai").value = mulai;
      document.getElementById("sdSelesai").value = selesai;
      document.getElementById("sdPagu").value = pagu;
      document.getElementById("sdRole").value = role;

      document.getElementById("modalSdTitle").textContent = (subAction === 'edit') ? "Edit Data SD" : "Tambah SD Baru";

      if(mulai && numMasaPks) {
        calculateTanggalSelesai();
      }

      modalSdObj.show();
    }

    // SIMPAN DATA (SUBMIT FORM)
    document.getElementById("formSd").onsubmit = async function(e) {
      e.preventDefault();
      
      const masaPksVal = document.getElementById("sdMasaPks").value;
      const npsnVal = document.getElementById("sdNpsn").value.trim();

      if (!npsnVal) return showToast("NPSN tidak boleh kosong!", false);

      const payload = {
        action: "manageMasterSd", 
        subAction: document.getElementById("sdSubAction").value,
        npsn: npsnVal, 
        password: document.getElementById("sdPass").value,
        sekolah: document.getElementById("sdNama").value, 
        kecamatan: document.getElementById("sdKecamatan").value,
        masaPks: masaPksVal ? `${masaPksVal} Hari` : "-", 
        mulai: document.getElementById("sdMulai").value,
        selesai: document.getElementById("sdSelesai").value, 
        pagu: document.getElementById("sdPagu").value || 0,
        role: document.getElementById("sdRole").value, 
        _t: Date.now()
      };

      toggleLoading(true); 
      modalSdObj.hide();

      try {
        const queryParams = new URLSearchParams(payload).toString();
        const res = await fetch(`${SCRIPT_URL}?${queryParams}`);
        const r = await res.json();
        
        if (r.status === "success") {
          showToast(r.message, true); 
          loadMasterSd(); // Auto refresh tabel
        } else {
          showToast(r.message || "Gagal memperbarui data", false);
        }
      } catch(err) { 
        showToast("Terjadi kesalahan koneksi ke server", false); 
      } finally { 
        toggleLoading(false); 
      }
    };

    // HAPUS DATA SD
    async function deleteSd(npsn) {
      if (!confirm(`Apakah Anda yakin ingin menghapus data SD dengan NPSN ${npsn}?`)) return;

      toggleLoading(true);
      try {
        const payload = {
          action: "manageMasterSd",
          subAction: "delete",
          npsn: npsn,
          _t: Date.now()
        };
        const queryParams = new URLSearchParams(payload).toString();
        const res = await fetch(`${SCRIPT_URL}?${queryParams}`);
        const r = await res.json();

        if (r.status === "success") {
          showToast(r.message, true);
          loadMasterSd();
        } else {
          showToast(r.message || "Gagal menghapus data", false);
        }
      } catch(err) {
        showToast("Gagal koneksi server saat menghapus data", false);
      } finally {
        toggleLoading(false);
      }
    }
  </script>
</body>
</html>
