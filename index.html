<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Master Data SD Minimalis</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .hidden { display: none !important; }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #f8f9fa; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #bd2130; }
  </style>
</head>
<body>

  <!-- LOGIN FORM -->
  <div id="loginBox" class="container" style="max-width: 400px;">
    <h2>Login Sistem</h2>
    <input type="text" id="npsn" placeholder="NPSN">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Masuk</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardBox" class="container hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Master Data SD</h2>
      <button class="btn-danger" style="width: auto;" onclick="logout()">Logout</button>
    </div>

    <h3>Tambah / Edit Data SD</h3>
    <form id="sdForm" onsubmit="saveSd(event)">
      <input type="hidden" id="subAction" value="add">
      <input type="text" id="sdNpsn" placeholder="NPSN" required>
      <input type="password" id="sdPass" placeholder="Password" required>
      <input type="text" id="sdNama" placeholder="Nama Sekolah" required>
      <input type="text" id="sdKecamatan" placeholder="Kecamatan" required>
      <input type="number" id="sdMasaPks" placeholder="Masa PKS (Hari)" required>
      <input type="date" id="sdMulai" placeholder="Mulai" required>
      <input type="date" id="sdSelesai" placeholder="Selesai" required>
      <input type="number" id="sdPagu" placeholder="Pagu (Rp)" required>
      <select id="sdRole">
        <option value="SEKOLAH">SEKOLAH</option>
        <option value="DINAS">DINAS</option>
      </select>
      <button type="submit">Simpan Data</button>
    </form>

    <hr>

    <table>
      <thead>
        <tr>
          <th>NPSN</th>
          <th>Sekolah</th>
          <th>Kecamatan</th>
          <th>Pagu (Rp)</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwtLU0t_yRti46VCjSCXzPFpEi_ufebnlDLBFkTVy-tjax-n0KgwLJfj9D6LqfmmbGA/exec";

    async function login() {
      const npsn = document.getElementById("npsn").value;
      const pass = document.getElementById("password").value;
      const res = await fetch(`${API_URL}?action=login&npsn=${npsn}&password=${pass}`);
      const data = await res.json();

      if (data.status === "success") {
        localStorage.setItem("session", JSON.stringify(data.data));
        render();
      } else {
        alert(data.message);
      }
    }

    function render() {
      const sess = localStorage.getItem("session");
      if (sess) {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("dashboardBox").classList.remove("hidden");
        loadData();
      } else {
        document.getElementById("loginBox").classList.remove("hidden");
        document.getElementById("dashboardBox").classList.add("hidden");
      }
    }

    function logout() {
      localStorage.removeItem("session");
      render();
    }

    async function loadData() {
      const res = await fetch(`${API_URL}?action=getMasterSd&_t=${Date.now()}`);
      const data = await res.json();
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      if (data.status === "success") {
        data.data.forEach(item => {
          tbody.innerHTML += `
            <tr>
              <td>${item.npsn}</td>
              <td>${item.sekolah}</td>
              <td>${item.kecamatan}</td>
              <td>Rp ${Number(item.pagu).toLocaleString('id-ID')}</td>
              <td>
                <button onclick="del('${item.npsn}')" class="btn-danger" style="width: auto; padding: 4px 8px;">Hapus</button>
              </td>
            </tr>
          `;
        });
      }
    }

    async function saveSd(e) {
      e.preventDefault();
      const payload = {
        action: "manageMasterSd",
        subAction: document.getElementById("subAction").value,
        npsn: document.getElementById("sdNpsn").value,
        password: document.getElementById("sdPass").value,
        sekolah: document.getElementById("sdNama").value,
        kecamatan: document.getElementById("sdKecamatan").value,
        masaPks: document.getElementById("sdMasaPks").value + " Hari",
        mulai: document.getElementById("sdMulai").value,
        selesai: document.getElementById("sdSelesai").value,
        pagu: document.getElementById("sdPagu").value,
        role: document.getElementById("sdRole").value,
        _t: Date.now()
      };

      const params = new URLSearchParams(payload).toString();
      const res = await fetch(`${API_URL}?${params}`);
      const data = await res.json();
      alert(data.message);
      loadData();
    }

    async function del(npsn) {
      if (!confirm("Hapus data ini?")) return;
      const res = await fetch(`${API_URL}?action=manageMasterSd&subAction=delete&npsn=${npsn}&_t=${Date.now()}`);
      const data = await res.json();
      alert(data.message);
      loadData();
    }

    render();
  </script>
</body>
</html>
